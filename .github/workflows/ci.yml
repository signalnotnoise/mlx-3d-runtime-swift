name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Build, test, and build the example (macOS)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app/Contents/Developer ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - name: Show Xcode and Swift
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Ensure Metal toolchain
        run: |
          set -euo pipefail
          if ! xcodebuild -showComponent MetalToolchain; then
            echo "Metal toolchain is not installed. Downloading it."
            xcodebuild -downloadComponent MetalToolchain
            xcodebuild -showComponent MetalToolchain
          fi

      - name: Point private package URLs at the pinned snapshots
        run: |
          set -euo pipefail
          # The Actions token cannot clone the private sibling repositories.
          # Package.swift still declares those GitHub URLs. This step serves the
          # pinned Vendor snapshots (see Vendor/SNAPSHOT.txt) as git mirrors.
          git config --global protocol.file.allow always
          prepare() {
            local dir="$1"
            local branch="$2"
            local bare="${dir}.git"
            rm -rf "${dir}/.git" "${bare}"
            git -C "${dir}" init -b "${branch}"
            git -C "${dir}" add -A
            git -C "${dir}" -c user.email="ci@example.com" -c user.name="CI" commit -m "Pinned snapshot"
            git clone --bare "${dir}" "${bare}"
            git config --global --add safe.directory "${dir}"
            git config --global --add safe.directory "${bare}"
          }
          prepare "${GITHUB_WORKSPACE}/Vendor/shap-e-mlx-swift" "cursor/shap-e-runtime-package-ea5b"
          prepare "${GITHUB_WORKSPACE}/Vendor/triposr-mlx-swift" "cursor/triposr-mlx-swift-package-45c1"
          git config --global url."${GITHUB_WORKSPACE}/Vendor/shap-e-mlx-swift.git".insteadOf "https://github.com/signalnotnoise/shap-e-mlx-swift.git"
          git config --global url."${GITHUB_WORKSPACE}/Vendor/shap-e-mlx-swift.git".insteadOf "https://github.com/signalnotnoise/shap-e-mlx-swift"
          git config --global url."${GITHUB_WORKSPACE}/Vendor/triposr-mlx-swift.git".insteadOf "https://github.com/signalnotnoise/triposr-mlx-swift.git"
          git config --global url."${GITHUB_WORKSPACE}/Vendor/triposr-mlx-swift.git".insteadOf "https://github.com/signalnotnoise/triposr-mlx-swift"
          python3 - << 'PY'
          import json
          import os
          from pathlib import Path

          workspace = os.environ["GITHUB_WORKSPACE"]
          mirrors = {
              "version": 1,
              "object": [
                  {
                      "original": "https://github.com/signalnotnoise/shap-e-mlx-swift.git",
                      "mirror": f"{workspace}/Vendor/shap-e-mlx-swift.git",
                  },
                  {
                      "original": "https://github.com/signalnotnoise/shap-e-mlx-swift",
                      "mirror": f"{workspace}/Vendor/shap-e-mlx-swift.git",
                  },
                  {
                      "original": "https://github.com/signalnotnoise/triposr-mlx-swift.git",
                      "mirror": f"{workspace}/Vendor/triposr-mlx-swift.git",
                  },
                  {
                      "original": "https://github.com/signalnotnoise/triposr-mlx-swift",
                      "mirror": f"{workspace}/Vendor/triposr-mlx-swift.git",
                  },
              ],
          }
          home = Path.home() / ".swiftpm" / "config" / "mirrors.json"
          destinations = [
              Path(workspace) / ".swiftpm" / "config" / "mirrors.json",
              Path(workspace) / "Examples" / "Integration" / ".swiftpm" / "config" / "mirrors.json",
              home,
          ]
          payload = json.dumps(mirrors, indent=2) + "\n"
          for path in destinations:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(payload)
          PY

      - name: List schemes
        run: xcodebuild -list -skipPackagePluginValidation

      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme MLX3DRuntime-Package \
            -destination 'platform=macOS' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -parallel-testing-enabled NO \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/SourcePackages" \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build the example
        working-directory: Examples/Integration
        run: |
          set -euo pipefail
          xcodebuild -list -skipPackagePluginValidation
          xcodebuild build \
            -scheme MLX3DExample \
            -destination 'platform=macOS' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/SourcePackages" \
            -derivedDataPath "${RUNNER_TEMP}/ExampleDerived" \
            CODE_SIGNING_ALLOWED=NO
